name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
    
jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        env:
          MONGO_URI: 'mongodb://localhost:27017/superData?authSource=admin'
          MONGO_USERNAME: admin
          MONGO_PASSWORD: admin
        services:
          mongo:
            image: mongo:7
            env:
              MONGO_INITDB_ROOT_USERNAME: admin
              MONGO_INITDB_ROOT_PASSWORD: admin
            ports:
              - 27017:27017
            options: >-
              --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
              --health-interval 5s
              --health-timeout 5s
              --health-retries 10
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Seed MongoDB
          run: docker exec -i ${{ job.services.mongo.id }} mongosh --quiet "mongodb://admin:admin@localhost:27017/superData?authSource=admin" < scripts/seed.js

        - name: Setup NodeJS Version
          uses: actions/setup-node@v4
          with:
            node-version: 20

        - name: Install Dependencies
          run: npm ci

        - name: Unit Testing
          run: npm test

        - name: Archive Test Result
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result
            path: test-results.xml