# Solar System CI/CD Workflow
name: Solar System CI/CD

# declencheurs 
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'lab/*'

# environment variables
env:
  MONGO_URI: 'mongodb://localhost:27017/superData?authSource=admin'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
  unit-testing:
    strategy:
      matrix:
        node-version: [24]
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      # clone the repository
      - name: Clone repository
        uses: actions/checkout@v7

      # setup node version 
      - name: setup node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: cache NPM dependencies
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}

      # install dependencies
      - name: Install dependencies
        run: npm ci

      # seed the database
      - name: Seed MongoDB
        run: docker exec -i ${{ job.services.mongo.id }} mongosh --quiet -u "$MONGO_USERNAME" -p "$MONGO_PASSWORD" --authenticationDatabase admin superData < scripts/seed.js
      
      # run tests
      # by default all steps status default to 'success' unless a command fails (non-zero exit code)
      - name: Run tests
        id: unit_testing_step
        run: npm test

      # Archive test results even if the tests fail
      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results.xml

    # setup MongoDB service
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: ${{ vars.MONGO_USERNAME }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

  code-coverage:
    #needs: unit-testing
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v7
      
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: cache NPM dependencies
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: run code coverage
        id: run_code_coverage
        run: npm run coverage
        continue-on-error: true
 
      - name: Upload code coverage report
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: coverage
          retention-days: 5

  docker:
    needs: [unit-testing, code-coverage]
    runs-on: ubuntu-latest

    steps: 
      - name: checkout node
        uses: actions/checkout@v7

      - name: docker login
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # build and push docker image
      - name: build docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ vars.DOCKER_USERNAME }}/solar-system:latest

      - name: Test docker image
        run: |
          docker images \
          docker run --name solar-system-test -d \
            -p 3000:3000 \
            -e MONGO_URI=$MONGO_URI \
            -e MONGO_USERNAME=$MONGO_USERNAME \
            -e MONGO_PASSWORD=$MONGO_PASSWORD \
            ${{ env.DOCKER_USERNAME }}/solar-system:${{ github.sha }}

          export IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-test)
          echo "Docker container IP: $IP"

          echo "Waiting for the application to start..."
          wget -q -O 127.0.0.1:3000/live | grep live
