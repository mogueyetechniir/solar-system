# Solar System CI/CD Workflow
name: Solar System CI/CD

# declencheurs 
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'lab/*''

jobs:
  unit-testing:
    runs-on: ubuntu-latest

    steps:
      # clone the repository
      - name: Clone repository
        uses: actions/checkout@v7

      # setup node version
      - name: Install dependencies
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      
      # install dependencies
      - name: Install dependencies
        run: npm install

      # run tests
      - name: Run tests
        run: npm test
  