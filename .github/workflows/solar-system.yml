# Solar System CI/CD Workflow
name: Solar System CI/CD

# declencheurs 
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'lab/*'

# environment variables
env:
  MONGO_URI: 'mongodb://localhost:27017/superData?authSource=admin'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
  unit-testing:
    strategy:
      matrix:
        node-version: [22, 24]
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          - os: windows-latest
            node-version: 22
          - os: [windows-latest, macos-latest]
            node-version: 24

    runs-on: ${{ matrix.os }}

    steps:
      # clone the repository
      - name: Clone repository
        uses: actions/checkout@v7

      # setup node version
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      
      # install dependencies
      - name: Install dependencies
        run: npm ci

      # seed the database
      - name: Seed MongoDB
        run: docker exec -i ${{ job.services.mongo.id }} mongosh --quiet -u "$MONGO_USERNAME" -p "$MONGO_PASSWORD" --authenticationDatabase admin superData < scripts/seed.js
      
      # run tests
      - name: Run tests
        run: npm test

    # setup MongoDB service
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: ${{ vars.MONGO_USERNAME }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      